name: Build Android APK - Database Forze dell'Ordine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'app-icon.svg'
      - 'service-worker.js'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'supabase/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Validate app metadata
        run: |
          node -e "const fs=require('fs'); const p=require('./package.json'); const c=require('./capacitor.config.json'); const m=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8')); if(!p.dependencies?.['@capacitor/android'] || !c.appId || !c.appName || c.webDir!=='www' || !m.name || !m.start_url) throw new Error('Invalid app metadata'); console.log('App ID:',c.appId); console.log('Capacitor:',p.dependencies['@capacitor/android']);"

      - name: Prepare app web assets
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest app-icon.svg app-hero.svg service-worker.js www/
          test -s www/index.html
          test -s www/manifest.webmanifest
          test -s www/service-worker.js

      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("www/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>([\s\S]*?)</script>", html, re.I)
          if not scripts:
              raise SystemExit("No inline scripts found")
          for index, source in enumerate(scripts, 1):
              Path(f"/tmp/inline-{index}.js").write_text(source, encoding="utf-8")
          print(f"Extracted {len(scripts)} inline script blocks")
          PY
          for script in /tmp/inline-*.js; do node --check "$script"; done

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify dependency tree
        run: npm ls --depth=0

      - name: Bundle Supabase client locally
        run: |
          test -s node_modules/@supabase/supabase-js/dist/umd/supabase.js
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/supabase.js
          test -s www/supabase.js

      - name: Generate Android project
        run: npx cap add android

      - name: Generate Android launcher icons
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p www
          rsvg-convert -w 512 -h 512 app-icon.svg -o www/app-icon-512.png
          for spec in 'mdpi 48' 'hdpi 72' 'xhdpi 96' 'xxhdpi 144' 'xxxhdpi 192'; do
            set -- $spec
            density=$1
            size=$2
            mkdir -p "android/app/src/main/res/mipmap-$density"
            rsvg-convert -w "$size" -h "$size" app-icon.svg -o "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            cp "android/app/src/main/res/mipmap-$density/ic_launcher.png" "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done
          # Adaptive launcher icon for Android 8+.
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/drawable-nodpi android/app/src/main/res/values
          rsvg-convert -w 432 -h 432 app-icon.svg -o android/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <resources><color name="ic_launcher_background">#111820</color></resources>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background" />
            <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Sync web app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -F "package: name='it.databaseforzeordine.app'"
          mkdir -p build-output
          cp "$APK" build-output/Database-Forze-Ordine-debug.apk
          sha256sum build-output/Database-Forze-Ordine-debug.apk | tee build-output/SHA256SUMS.txt
          {
            echo "Commit: ${GITHUB_SHA}"
            echo "Build: ${GITHUB_RUN_NUMBER}"
            echo "Type: debug APK (not a production-signed release)"
            echo "Application ID: it.databaseforzeordine.app"
          } > build-output/BUILD-INFO.txt

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Database-Forze-Ordine-Android-debug
          path: build-output/*
          if-no-files-found: error
          retention-days: 30
