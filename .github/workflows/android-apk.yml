name: Build Android APK - Database Forze dell'Ordine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'app-icon.svg'
      - 'app-icon-foreground.svg'
      - 'app-icon-monochrome.svg'
      - 'service-worker.js'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'supabase/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Validate app metadata
        run: |
          node -e "const fs=require('fs'); const p=require('./package.json'); const c=require('./capacitor.config.json'); const m=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8')); if(!p.dependencies?.['@capacitor/android'] || !c.appId || !c.appName || c.webDir!=='www' || !m.name || !m.start_url) throw new Error('Invalid app metadata'); console.log('App ID:',c.appId); console.log('Capacitor:',p.dependencies['@capacitor/android']);"

      - name: Prepare app web assets
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest app-icon.svg app-icon-foreground.svg app-icon-monochrome.svg app-hero.svg service-worker.js www/
          test -s www/index.html
          test -s www/manifest.webmanifest
          test -s www/service-worker.js

      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text()
          scripts=re.findall(r'<script\b([^>]*)>([\s\S]*?)</script>', html, re.I)
          count=0
          for attrs, body in scripts:
              if re.search(r'\bsrc\s*=', attrs) or not body.strip():
                  continue
              count += 1
              Path(f"/tmp/inline-{count}.js").write_text(body)
          if count == 0:
              raise SystemExit("No inline JavaScript blocks found")
          print(f"Extracted {count} inline JavaScript blocks")
          PY
          for script in /tmp/inline-*.js; do node --check "$script"; done

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify dependency tree
        run: npm ls --depth=0

      - name: Bundle Supabase client locally
        run: |
          test -s node_modules/@supabase/supabase-js/dist/umd/supabase.js
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/supabase.js
          test -s www/supabase.js

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Apply verified launcher icon after Capacitor sync
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p www
          rsvg-convert -w 192 -h 192 app-icon.svg -o www/app-icon-192.png
          rsvg-convert -w 512 -h 512 app-icon.svg -o www/app-icon-512.png
          test -s www/app-icon-192.png
          test -s www/app-icon-512.png
          for spec in 'mdpi 48' 'hdpi 72' 'xhdpi 96' 'xxhdpi 144' 'xxxhdpi 192'; do
            set -- $spec
            density=$1
            size=$2
            mkdir -p "android/app/src/main/res/mipmap-$density"
            rsvg-convert -w "$size" -h "$size" app-icon.svg -o "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            cp "android/app/src/main/res/mipmap-$density/ic_launcher.png" "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done
          # Adaptive launcher icon for Android 8+.
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/drawable-nodpi android/app/src/main/res/values
          test -s app-icon-foreground.svg
          test -s app-icon-monochrome.svg
          rsvg-convert -w 432 -h 432 app-icon-foreground.svg -o android/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          rsvg-convert -w 432 -h 432 app-icon-monochrome.svg -o android/app/src/main/res/drawable-nodpi/ic_launcher_monochrome.png
          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <resources><color name="ic_launcher_background">#111820</color></resources>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background" />
            <foreground android:drawable="@drawable/ic_launcher_foreground" />
            <monochrome android:drawable="@drawable/ic_launcher_monochrome" />
          </adaptive-icon>
          EOF
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          match=re.search(r'<application\b[^>]*>', s)
          if not match:
              raise SystemExit("Android application tag not found")
          tag=match.group(0)
          for attr in ("icon", "roundIcon", "label"):
              tag=re.sub(r'\sandroid:'+attr+r'="[^"]*"', "", tag)
          tag=tag[:-1]+' android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:label="Database Forze Ordine">'
          p.write_text(s[:match.start()]+tag+s[match.end():])
          print("Launcher icon and app label assigned")
          PY
          echo "Checking launcher icon resources and home-screen entry point"
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s android/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          test -s android/app/src/main/res/drawable-nodpi/ic_launcher_monochrome.png
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        working-directory: android
        timeout-minutes: 12
        run: ./gradlew assembleDebug --no-daemon --stacktrace --console=plain

      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='it.databaseforzeordine.app'"
          echo "$BADGING" | grep -F "application-icon-160:"
          echo "$BADGING" | grep -F "launchable-activity:"
          echo "$BADGING" | grep -F "application-label:'Database Forze Ordine'"
          mkdir -p build-output
          cp "$APK" build-output/Database-Forze-Ordine-debug.apk
          sha256sum build-output/Database-Forze-Ordine-debug.apk | tee build-output/SHA256SUMS.txt
          {
            echo "Commit: ${GITHUB_SHA}"
            echo "Build: ${GITHUB_RUN_NUMBER}"
            echo "Type: debug APK (not a production-signed release)"
            echo "Application ID: it.databaseforzeordine.app"
          } > build-output/BUILD-INFO.txt

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Database-Forze-Ordine-Android-debug
          path: build-output/*
          if-no-files-found: error
          retention-days: 30
