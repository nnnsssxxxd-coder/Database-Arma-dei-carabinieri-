name: App quality gate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: |
          deno check --no-config --no-lock \
            supabase/functions/game-engine/index.ts \
            supabase/functions/admin-create-user/index.ts \
            supabase/functions/admin-user-action/index.ts \
            supabase/functions/quiz-engine/index.ts \
            supabase/functions/ministry-admin-action/index.ts \
            supabase/functions/command-general-action/index.ts \
            supabase/functions/department-engine/index.ts \
            supabase/functions/audit-event/index.ts \
            supabase/functions/username-login/index.ts \
            supabase/functions/command-general-login/index.ts \
            supabase/functions/ministry-login/index.ts \
            supabase/functions/site/index.ts \
            supabase/functions/traffic-control-engine/index.ts
      - name: Validate manifest and application shell
        run: |
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8')); if(!m.name || !m.start_url || !Array.isArray(m.icons) || !m.icons.length) process.exit(1); for(const f of ['index.html','service-worker.js','app-icon.svg']) if(!fs.existsSync(f)) throw new Error('Missing '+f);"
      - name: Parse inline JavaScript
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          let n=0;
          for (const [,attrs,body] of scripts) {
            if (/\bsrc\s*=/.test(attrs) || !body.trim()) continue;
            const file='/tmp/app-inline-'+(++n)+'.js';
            fs.writeFileSync(file,body);
            require('child_process').execFileSync(process.execPath,['--check',file],{stdio:'inherit'});
          }
          if(!n) throw new Error('No inline application scripts were checked');
          console.log('Checked '+n+' inline script(s)');
          NODE
      - name: Validate DOM references and login recovery messages
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const ids=[...html.matchAll(/\bid=["']([^"']+)["']/g)].map(x=>x[1]);
          const duplicates=[...new Set(ids.filter((id,i)=>ids.indexOf(id)!==i))];
          if(duplicates.length) throw new Error('Duplicate DOM IDs: '+duplicates.join(', '));
          const known=new Set(ids);
          const refs=[...html.matchAll(/\$\(["']([^"']+)["']\)/g)].map(x=>x[1]);
          const missing=[...new Set(refs.filter(id=>!known.has(id)))];
          if(missing.length) throw new Error('Missing DOM elements: '+missing.join(', '));
          if(html.includes('La sessione salvata non è stata cancellata')) throw new Error('Login recovery message contradicts the explicit prior-session cleanup');
          console.log('PASS '+ids.length+' unique DOM IDs and '+new Set(refs).size+' direct ID references');
          NODE
      - name: Prevent fake plates in non-road patrol scenes
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const engine=fs.readFileSync('supabase/functions/traffic-control-engine/index.ts','utf8');
          if(!html.includes('const showVehicleReference=!isFinanza&&!nonRoadScene&&Boolean(simPlate)')) throw new Error('Finanza and non-road patrol scenes must suppress vehicle plate references');
          if(!html.includes('/^SIM\\s/i.test(rawPlate)')) throw new Error('Synthetic vehicle reference prefix must be parsed correctly');
          if(!engine.includes('if(branch==="finanza"){publicScenario.plate=""')) throw new Error('Finanza public scenario must not expose a fake plate');
          console.log('PASS non-road scenes hide plate references; Finanza hides plates; synthetic road references are parsed');
          NODE
      - name: Check branch isolation guards
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const checks=[
            ['branch selector persistence',/selectedServiceBranch|selectedBranch/],
            ['branch-aware quiz calls',/quiz-engine[\s\S]{0,1200}service_branch/],
            ['branch-aware department calls',/department-engine[\s\S]{0,1200}service_branch/],
            ['branch-scoped profile reads',/eq\(\"service_branch\",selectedBranch\)/],
            ['branch-scoped account actions',/service_branch:selectedBranch/],
            ['branch-scoped audit events',/audit-event[\s\S]{0,500}service_branch/]
          ];
          for(const [name,re] of checks){if(!re.test(html))throw new Error('Failed: '+name);console.log('PASS '+name);}
          NODE
      - name: Validate account provisioning and mobile table layout
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const ids=[...html.matchAll(/\bid=["']([^"']+)["']/g)].map(x=>x[1]);
          for(const id of ['centralNewPassword','centralChangePassword','centralNewRank','centralCreateUser','centralCreateCommandAdmin']){
            const count=ids.filter(x=>x===id).length;
            if(count!==1)throw new Error('Expected exactly one #'+id+', found '+count);
          }
          if(!/<select\b[^>]*id=["']centralNewRank["']/.test(html))throw new Error('Initial rank must be selected from the official rank list');
          if(!html.includes('central-table-isolated-scroll'))throw new Error('Isolated account table scroll styles missing');
          if(!html.includes('overscroll-behavior-x:contain'))throw new Error('Account table horizontal scroll must be contained');
          console.log('PASS unique admin form controls, rank selector and contained table scroll');
          NODE
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const instructor=fs.readFileSync('supabase/functions/admin-create-user/index.ts','utf8');
          const ministry=fs.readFileSync('supabase/functions/ministry-admin-action/index.ts','utf8');
          for(const id of ['newName','centralNewName','centralCommandName']){
            if(!html.includes('id="'+id+'" minlength="2"') && !html.includes('id="'+id+'" required minlength="2"')) throw new Error('Name field must enforce two characters: '+id);
          }
          if(!instructor.includes('display_name.length<2'))throw new Error('Instructor account name validation is inconsistent');
          if(!instructor.includes('["istruttore","admin"].includes(creatorMembership.role)'))throw new Error('Authorized administrator role missing from provisioning guard');
          if(!ministry.includes('display.length<2'))throw new Error('Command administrator name validation is inconsistent');
          console.log('PASS consistent account-name validation and role authorization');
          const action=fs.readFileSync('supabase/functions/admin-user-action/index.ts','utf8');
          const statusMigration=fs.readFileSync('supabase/migrations/20261124190400_deactivate_profiles_without_active_memberships.sql','utf8');
          if(!action.includes('activeMembershipCount')||!action.includes('update({active:(activeMembershipCount??0)>0})'))throw new Error('Profile active state must follow remaining active Corps memberships');
          if(!statusMigration.includes('not exists(')||!statusMigration.includes('m.active=true'))throw new Error('Profiles without active memberships must be disabled without deleting history');
          console.log('PASS profile activation is synchronized with active branch memberships');

          const migration=fs.readFileSync('supabase/migrations/20261109212000_prevent_rank_exam_beyond_maximum.sql','utf8');
          for(const required of ['if v_rank>=v_max_rank','v_max_rank:=23','v_max_rank:=23','Esame già consegnato','a.started_at<now()-interval \'20 minutes\'']){
            if(!migration.includes(required))throw new Error('Missing rank-exam safeguard: '+required);
          }
          console.log('PASS rank-exam terminal-grade guard for both service branches');
          NODE
          for file in supabase/functions/command-general-action/index.ts supabase/functions/ministry-admin-action/index.ts supabase/functions/admin-create-user/index.ts; do
            test -s "$file"
            grep -q "account provisioning rollback" "$file"
            grep -q "field:" "$file"
            grep -q "from(\"progress\").upsert" "$file"
            grep -q "from(\"progress\").delete" "$file"
          done
          echo "PASS server-side account provisioning, progression initialization, validation and rollback guards"

      - name: Validate branch isolation, backend error handling and removed controls
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const game=fs.readFileSync('supabase/functions/game-engine/index.ts','utf8');
          const admin=fs.readFileSync('supabase/functions/admin-user-action/index.ts','utf8');
          const quiz=fs.readFileSync('supabase/functions/quiz-engine/index.ts','utf8');
          const branchMigration=fs.readFileSync('supabase/migrations/20261114165756_enable_finanza_department_career.sql','utf8');
          const repairMigration=fs.readFileSync('supabase/migrations/20261119210000_harden_department_branch_columns.sql','utf8');
          for(const [name,source] of [['game-engine',game],['admin-user-action',admin]]){
            if(!source.includes('"https://nnnsssxxxd-coder.github.io"')) throw new Error(name+' is missing GitHub Pages CORS origin');
          }
          for(const path of ['supabase/functions/admin-create-user/index.ts','supabase/functions/ministry-admin-action/index.ts','supabase/functions/command-general-action/index.ts']){
            if(!fs.readFileSync(path,'utf8').includes('https://nnnsssxxxd-coder.github.io')) throw new Error(path+' is missing GitHub Pages CORS origin');
          }
          for(const token of ['profileError','membershipError','progressError','rankError','expireError','openError','recentError']){
            if(!quiz.includes(token)) throw new Error('quiz-engine missing checked database error: '+token);
          }
          const tables=['department_catalog','department_memberships','department_questions','department_quiz_attempts','department_commanders','department_exercises','department_exercise_questions','department_exercise_assignments','department_exercise_attempts','department_command_exam_attempts'];
          for(const table of tables){
            if(!branchMigration.includes("'"+table+"'")||!repairMigration.includes("'"+table+"'")) throw new Error('Missing branch migration for '+table);
          }
          for(const id of ['id="traffic"','id="trafficScene"','id="trafficStart"','id="musicYes"','id="musicNo"','id="musicPlayer"']){
            if(html.includes(id)) throw new Error('Removed UI control returned: '+id);
          }
          if(/const allowed=\[[^\]]*"traffic"/.test(html)) throw new Error('Removed traffic page still appears in navigation allow-list');
          const progressRepair=fs.readFileSync('supabase/migrations/20261119210000_harden_department_branch_columns.sql','utf8');
          for(const token of ['INSERT INTO public.progress','ON CONFLICT(user_id,service_branch) DO NOTHING','jsonb_set(','m.initial_rank']){
            if(!progressRepair.includes(token)) throw new Error('Missing progression repair safeguard: '+token);
          }
          console.log('PASS CORS, query error handling, department branch schema, progression repair and removed controls');
          NODE

      - name: Validate both Corps, quiz counts, brevetto cycles and Android icon
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const quiz=fs.readFileSync('supabase/functions/quiz-engine/index.ts','utf8');
          const brevetto=fs.readFileSync('supabase/functions/department-engine/index.ts','utf8');
          const traffic=fs.readFileSync('supabase/functions/traffic-control-engine/index.ts','utf8');
          const migration=fs.readFileSync('supabase/migrations/20261124190000_vehicle_brevetto_six_attempt_cycle.sql','utf8');
          const build=fs.readFileSync('.github/workflows/android-apk.yml','utf8');
          function ranks(name){
            const match=html.match(new RegExp('const '+name+'=\\[([^\\]]+)\\]'));
            if(!match)throw new Error('Missing '+name);
            return [...match[1].matchAll(/"([^"]+)"/g)].map(x=>x[1]);
          }
          for(const name of ['CARABINIERI_RANKS','FINANZA_RANKS']){
            const list=ranks(name);
            if(list.length!==24)throw new Error(name+' should contain 24 ordered official grades, found '+list.length);
            if(new Set(list).size!==list.length)throw new Error(name+' contains duplicate grades');
          }
          for(const token of ['#d4af37','#0d3b27','applyServiceBranding','FINANZA_RANKS','CARABINIERI_RANKS']){
            if(!html.includes(token))throw new Error('Missing branch identity: '+token);
          }
          if(!quiz.includes('shuffled.slice(0,5)')||!quiz.includes('answers.length!==5')||!html.includes('DOMANDA 1 / 5'))throw new Error('Rank exam must use five questions end-to-end');
          if(!brevetto.includes('start_vehicle_brevetto_attempt')||!brevetto.includes('answers.length!==8'))throw new Error('Eight-question brevetto flow is incomplete');
          for(const token of ['completed_attempts between 0 and 6',"interval '12 hours'","used_question_ids=array","jsonb_array_length(questions)=8","score <= 8"]){
            if(!migration.includes(token))throw new Error('Brevetto migration missing safeguard: '+token);
          }
          const monochrome=fs.readFileSync('app-icon-monochrome.svg','utf8');
          const iconConcurrency=fs.readFileSync('supabase/migrations/20261124230000_harden_vehicle_brevetto_start_concurrency.sql','utf8');
          if(!build.includes('app-icon.svg')||!build.includes('mipmap-anydpi-v26/ic_launcher.xml')||!build.includes('ic_launcher_monochrome.png')||!build.includes('android:icon="@mipmap/ic_launcher_legacy"')||!build.includes('android:roundIcon="@mipmap/ic_launcher_round_legacy"')||!build.includes('launchable-activity:')||!build.includes('application-icon-160:'))throw new Error('Adaptive, monochrome and legacy launcher icons plus launchable activity must be verified');
          if(!monochrome.includes('fill="#fff"')||!monochrome.includes('fill-rule="evenodd"'))throw new Error('The app icon source assets must retain a valid monochrome shield');
          if(!iconConcurrency.includes('pg_advisory_xact_lock')||!iconConcurrency.includes("NOTIFY pgrst, 'reload schema'"))throw new Error('Brevetto start must serialize concurrent attempts and refresh PostgREST RPC metadata');
          if(!traffic.includes('const finanzaScenarios')||!traffic.includes('scenarioPool=scenariosByBranch[branch as keyof typeof scenariosByBranch]'))throw new Error('The Guardia di Finanza needs its own economic-financial control scenarios');
          if(!traffic.includes('id:"fiscal_docs"')||!traffic.includes('id:"accounting"')||!traffic.includes('id:"inventory"')||!traffic.includes('fuel_station')||!traffic.includes('Esame dei documenti fiscali e commerciali')||!html.includes('id:"fiscal_docs"')||!html.includes('plateEl.hidden=!showVehicleReference')||!html.includes('GESTORE · ')||!html.includes('return"fuel_station"'))throw new Error('The Guardia di Finanza patrol UI must use contextual fiscal/business checks, identify fuel-station roles correctly and hide fictitious plates');

          console.log('PASS official rank lists, separate corps branding, five-question promotion exam, eight-question brevetto, six-attempt cooldown and density-specific PNG APK icon');
          const dollarArgs=[...html.matchAll(/\\$\\(["']([^"']+)["']\\)/g)].map(x=>x[1]);
          if(dollarArgs.some(x=>x.startsWith('.')||x.startsWith('#')||x.startsWith('['))) throw new Error('The ID helper $() must not receive CSS selectors; use querySelector instead');
          if(!html.includes('rank>=9?"ISPETTORE":rank>=5?"SOVRINTENDENTE"')) throw new Error('Personnel role categories must distinguish inspectors and warrant officers');
          if(!html.includes('x.type==="vehicle_brevetto"?8')) throw new Error('Progress chart must use eight as the brevetto denominator');
          if(!html.includes('selectedBranch==="finanza"?"#d4af37":"#d71930"')) throw new Error('Rank graphic accents must follow the selected service branch');
          const command=fs.readFileSync('supabase/functions/command-general-action/index.ts','utf8');
          if(command.includes('rankFor(m)===24')||html.includes('branch==="finanza"?24:23')||html.includes('to==="finanza"?24:23')) throw new Error('Finanza rank ceiling must be index 23 (24 real grades)');
          console.log('PASS identical zero-based rank bounds across both Corps');

          console.log('PASS selector safety, real personnel-role grouping, mixed quiz score chart and branch-specific grade graphics');
          NODE

      - name: Validate complete quiz-bank explanations
        run: |
          node <<'NODE'
          const fs=require('fs');
          const migration=fs.readFileSync('supabase/migrations/20261124175304_complete_carabinieri_quiz_explanations.sql','utf8');
          const ids=[...migration.matchAll(/when '[0-9a-f-]{36}' then/g)];
          if(ids.length!==38)throw new Error('Expected 38 individually explained Carabinieri questions, found '+ids.length);
          if(!migration.includes("where service_branch='carabinieri'"))throw new Error('Explanation migration must be scoped to Carabinieri');
          const engine=fs.readFileSync('supabase/functions/quiz-engine/index.ts','utf8');
          if(!engine.includes('if(error||!pool||pool.length<5)'))throw new Error('Rank exam must fail closed on incomplete question bank');
          console.log('PASS 38 missing explanations are supplied and rank exam bank guard remains enabled');
          NODE
      - name: Validate sourced brevetto bank seed and progress feedback
        run: |
          node <<'NODE'
          const fs=require('fs');
          const physics=fs.readFileSync('supabase/migrations/20261124190000_seed_vehicle_physics_30.sql','utf8');
          const rules=fs.readFileSync('supabase/migrations/20261124190100_seed_vehicle_regulations_30.sql','utf8');
          const technical=fs.readFileSync('supabase/migrations/20261124190200_seed_vehicle_technical_40.sql','utf8');
          const engine=fs.readFileSync('supabase/functions/department-engine/index.ts','utf8');
          const balance=fs.readFileSync('supabase/migrations/20261124190300_balance_physics_answer_positions.sql','utf8');
          if((physics.match(/"prompt":/g)||[]).length!==44)throw new Error('Physics seed must contain 22 land and 22 naval source questions');
          if((rules.match(/"prompt":/g)||[]).length!==60)throw new Error('Regulations seed must contain 30 road and 30 COLREG questions');
          if((technical.match(/"prompt":/g)||[]).length!==80)throw new Error('Technical seed must contain 40 land and 40 naval system questions');
          if(!balance.includes('array_position')||!balance.includes('md5('))throw new Error('Physics answer positions must be deterministically balanced');
          for(const vehicle of ['cc-subaru-crosstrek','cc-iveco-50c17-op','cc-defender-110','cc-jeep-wrangler','gdf-classe-monti','gdf-classe-di-bartolo','gdf-classe-bigliani-viii','gdf-bso-139']){
            if(!physics.includes(vehicle)||!rules.includes(vehicle)||!technical.includes(vehicle))throw new Error('Missing seed target '+vehicle);
          }
          if(!engine.includes('fisica ${bankCounts.physics}/30, tecniche ${bankCounts.technical}/40, normative ${bankCounts.regulations}/30'))throw new Error('Incomplete-bank progress message missing');
          const html=fs.readFileSync('index.html','utf8');
          if(!html.includes('id="vehicleBrevettoSource"')||!html.includes('sourceUrl=String(q[7]??"")')||!html.includes('sourceUrl.toLowerCase().startsWith("https://")'))throw new Error('Brevetto source links must be displayed only for HTTPS references');
          if(!engine.includes('bank.length===100&&bankCounts.physics===30&&bankCounts.technical===40')||!engine.includes('bankCounts.regulations===30&&seenPrompts.size===100'))throw new Error('Brevetto must remain blocked until exactly 30/40/30 questions are verified');
          console.log('PASS reproducible 30-question physics and 30-question regulation seed per vehicle, plus 40 technical questions, category progress and fail-closed guard');
          NODE
      - name: Validate privacy-safe adaptive screen profile and patrol EXP
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const migration=fs.readFileSync('supabase/migrations/20261124235000_reward_patrol_exp_only_when_correct.sql','utf8');
          const declared=[...html.matchAll(/(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(/g)].map(match=>match[1]);
          const duplicates=declared.filter((name,index)=>declared.indexOf(name)!==index);
          if(duplicates.length)throw new Error('Duplicate function declarations in app: '+[...new Set(duplicates)].join(', '));
          const build=fs.readFileSync('.github/workflows/android-apk.yml','utf8');
          for(const token of ['adaptive-device-profile','visualViewport','devicePixelRatio','safe-area-inset-top','prefers-reduced-motion','pointer: coarse','uiDevice','uiDensity']){
            if(!html.includes(token))throw new Error('Adaptive screen profile missing: '+token);
          }
          if(/navigator\\.(userAgent|platform)|getHighEntropyValues|deviceMemory/.test(html))throw new Error('Adaptive profile must not fingerprint device model or hardware');
          if(!migration.includes('v_reward := case when v_correct then 10 else 0 end;'))throw new Error('Patrol must award EXP only on correct decisions');
          if(!build.includes('android:icon="@mipmap/ic_launcher_legacy"'))throw new Error('Launcher activity/application icon assignment missing');
          if(!build.includes('grep -E \'/ic_launcher_foreground\\.png$\''))throw new Error('APK verification must locate the packaged adaptive foreground independent of resource qualifier');
          console.log('PASS: privacy-safe responsive profile, correct-only patrol EXP and robust APK icon checks');
          NODE
      - name: Validate patrol decision and reward invariants
        run: |
          node <<'NODE'
          const fs=require('fs');
          const reward=fs.readFileSync('supabase/migrations/20261124235000_reward_patrol_exp_only_when_correct.sql','utf8');
          const checks=fs.readFileSync('supabase/migrations/20261124235500_require_all_patrol_checks_before_finish.sql','utf8');
          const html=fs.readFileSync('index.html','utf8');
          for(const token of ['v_correct := p_chosen_action = v_session.correct_action;','v_reward := case when v_correct then 10 else 0 end;']){
            if(!reward.includes(token))throw new Error('Patrol reward guard missing: '+token);
          }
          for(const token of ["license","reports","inspection","Completa tutte e tre le verifiche prima della decisione finale"]){
            if(!checks.includes(token))throw new Error('Branch-specific patrol completion guard missing: '+token);
          }
          const branchChecks=fs.readFileSync('supabase/migrations/20261126100000_fix_branch_specific_patrol_check_completion.sql','utf8');
          for(const token of ["p_service_branch = 'finanza'",'["fiscal_docs","accounting","inventory"]','["license","reports","inspection"]']){
            if(!branchChecks.includes(token))throw new Error('Finanza/Carabinieri server-side check separation missing: '+token);
          }
          if(!html.includes('length<3'))throw new Error('Patrol UI must keep the final decision hidden until all checks are complete');
          const brevetto=fs.readFileSync('supabase/functions/department-engine/index.ts','utf8');
          const cycle=fs.readFileSync('supabase/migrations/20261124190000_vehicle_brevetto_six_attempt_cycle.sql','utf8');
          if(!brevetto.includes('const cooldownExpired=!!storedCooldown&&Date.parse(storedCooldown)<=Date.now()'))throw new Error('Expired brevetto cooldown must be presented as available in status');
          if(!brevetto.includes('attempts_remaining:Math.max(0,6-completed)'))throw new Error('Brevetto status must return authoritative remaining attempts');
          if(!brevetto.includes('const status=started.cooldown_until?200:'))throw new Error('Cooldown response must preserve its body so the client can render the 12-hour timer');
          if(!html.includes('Esercitazioni completate: "+vehicleBrevettoAttemptsCompleted+" / 6 · disponibili: "+vehicleBrevettoAttemptsRemaining+" / 6'))throw new Error('Brevetto progress counter missing or inconsistent with current Italian terminology');
          if(html.includes('Ciclo ripristinato. Puoi iniziare una nuova prova.'))throw new Error('Remove repeated red cycle-reset message');
          if(html.includes('#vehicleBrevettoAttempts{display:none!important}'))throw new Error('Brevetto attempts counter must be visible');
          if(!html.includes('start.disabled=!!cooling||vehicleBrevettoAttemptsRemaining<=0'))throw new Error('Start button must remain disabled during cooldown');
          if(!html.includes('const expiresAt=Date.parse(data.expires_at)')||!html.includes('if(!Number.isFinite(expiresAt)||expiresAt<=Date.now())'))throw new Error('Brevetto session timer must reject invalid/expired timestamps');
          if(!cycle.includes('when completed_attempts+1>=6 then now()+interval \'12 hours\''))throw new Error('Sixth completed quiz must trigger the 12-hour cooldown');
          console.log('PASS: brevetto 6-quiz counter, cooldown expiration, 12-hour timer, no stale reset message and session timer validation');
                    console.log('PASS: all three checks required server-side and 10 EXP granted only for correct decision');
          NODE
      - name: Validate maximum-grade command access parity
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          for(const name of ['CARABINIERI_RANKS','FINANZA_RANKS']){
            const start=html.indexOf('const '+name+'=[');
            const end=html.indexOf('];',start);
            if(start<0||end<0)throw new Error('Missing grade catalog '+name);
            const labels=[...html.slice(start,end).matchAll(/"[^"]+"/g)];
            if(labels.length!==24)throw new Error(name+' must contain 24 grades, found '+labels.length);
          }
          const login=fs.readFileSync('supabase/functions/command-general-login/index.ts','utf8');
          const action=fs.readFileSync('supabase/functions/command-general-action/index.ts','utf8');
          const ministry=fs.readFileSync('supabase/functions/ministry-admin-action/index.ts','utf8');
          const create=fs.readFileSync('supabase/functions/admin-create-user/index.ts','utf8');
