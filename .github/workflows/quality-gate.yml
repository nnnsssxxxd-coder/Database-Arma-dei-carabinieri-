name: App quality gate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: |
          deno check --no-config --no-lock \
            supabase/functions/game-engine/index.ts \
            supabase/functions/admin-create-user/index.ts \
            supabase/functions/admin-user-action/index.ts \
            supabase/functions/quiz-engine/index.ts \
            supabase/functions/ministry-admin-action/index.ts \
            supabase/functions/command-general-action/index.ts \
            supabase/functions/department-engine/index.ts \
            supabase/functions/audit-event/index.ts \
            supabase/functions/username-login/index.ts \
            supabase/functions/command-general-login/index.ts \
            supabase/functions/traffic-control-engine/index.ts
      - name: Validate manifest and application shell
        run: |
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8')); if(!m.name || !m.start_url || !Array.isArray(m.icons) || !m.icons.length) process.exit(1); for(const f of ['index.html','service-worker.js','app-icon.svg']) if(!fs.existsSync(f)) throw new Error('Missing '+f);"
      - name: Parse inline JavaScript
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          let n=0;
          for (const [,attrs,body] of scripts) {
            if (/\bsrc\s*=/.test(attrs) || !body.trim()) continue;
            const file='/tmp/app-inline-'+(++n)+'.js';
            fs.writeFileSync(file,body);
            require('child_process').execFileSync(process.execPath,['--check',file],{stdio:'inherit'});
          }
          if(!n) throw new Error('No inline application scripts were checked');
          console.log('Checked '+n+' inline script(s)');
          NODE
      - name: Check branch isolation guards
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const checks=[
            ['branch selector persistence',/selectedServiceBranch|selectedBranch/],
            ['branch-aware quiz calls',/quiz-engine[\s\S]{0,1200}service_branch/],
            ['branch-aware department calls',/department-engine[\s\S]{0,1200}service_branch/],
            ['branch-scoped profile reads',/eq\(\"service_branch\",selectedBranch\)/],
            ['branch-scoped account actions',/service_branch:selectedBranch/],
            ['branch-scoped audit events',/audit-event[\s\S]{0,500}service_branch/]
          ];
          for(const [name,re] of checks){if(!re.test(html))throw new Error('Failed: '+name);console.log('PASS '+name);}
          NODE
      - name: Validate account provisioning and mobile table layout
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const ids=[...html.matchAll(/\bid=["']([^"']+)["']/g)].map(x=>x[1]);
          for(const id of ['centralNewPassword','centralChangePassword','centralNewRank','centralCreateUser','centralCreateCommandAdmin']){
            const count=ids.filter(x=>x===id).length;
            if(count!==1)throw new Error('Expected exactly one #'+id+', found '+count);
          }
          if(!/<select\b[^>]*id=["']centralNewRank["']/.test(html))throw new Error('Initial rank must be selected from the official rank list');
          if(!html.includes('central-table-isolated-scroll'))throw new Error('Isolated account table scroll styles missing');
          if(!html.includes('overscroll-behavior-x:contain'))throw new Error('Account table horizontal scroll must be contained');
          console.log('PASS unique admin form controls, rank selector and contained table scroll');
          NODE
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const instructor=fs.readFileSync('supabase/functions/admin-create-user/index.ts','utf8');
          const ministry=fs.readFileSync('supabase/functions/ministry-admin-action/index.ts','utf8');
          for(const id of ['newName','centralNewName','centralCommandName']){
            if(!html.includes('id="'+id+'" minlength="2"') && !html.includes('id="'+id+'" required minlength="2"')) throw new Error('Name field must enforce two characters: '+id);
          }
          if(!instructor.includes('display_name.length<2'))throw new Error('Instructor account name validation is inconsistent');
          if(!instructor.includes('["istruttore","admin"].includes(creatorMembership.role)'))throw new Error('Authorized administrator role missing from provisioning guard');
          if(!ministry.includes('display.length<2'))throw new Error('Command administrator name validation is inconsistent');
          console.log('PASS consistent account-name validation and role authorization');
          const migration=fs.readFileSync('supabase/migrations/20261109212000_prevent_rank_exam_beyond_maximum.sql','utf8');
          for(const required of ['if v_rank>=v_max_rank','v_max_rank:=23','v_max_rank:=23','Esame già consegnato','a.started_at<now()-interval \'20 minutes\'']){
            if(!migration.includes(required))throw new Error('Missing rank-exam safeguard: '+required);
          }
          console.log('PASS rank-exam terminal-grade guard for both service branches');
          NODE
          for file in supabase/functions/command-general-action/index.ts supabase/functions/ministry-admin-action/index.ts supabase/functions/admin-create-user/index.ts; do
            test -s "$file"
            grep -q "account provisioning rollback" "$file"
            grep -q "field:" "$file"
            grep -q "from(\"progress\").upsert" "$file"
            grep -q "from(\"progress\").delete" "$file"
          done
          echo "PASS server-side account provisioning, progression initialization, validation and rollback guards"

      - name: Validate branch isolation, backend error handling and removed controls
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const game=fs.readFileSync('supabase/functions/game-engine/index.ts','utf8');
          const admin=fs.readFileSync('supabase/functions/admin-user-action/index.ts','utf8');
          const quiz=fs.readFileSync('supabase/functions/quiz-engine/index.ts','utf8');
          const branchMigration=fs.readFileSync('supabase/migrations/20261114165756_enable_finanza_department_career.sql','utf8');
          const repairMigration=fs.readFileSync('supabase/migrations/20261119210000_harden_department_branch_columns.sql','utf8');
          for(const [name,source] of [['game-engine',game],['admin-user-action',admin]]){
            if(!source.includes('"https://nnnsssxxxd-coder.github.io"')) throw new Error(name+' is missing GitHub Pages CORS origin');
          }
          for(const path of ['supabase/functions/admin-create-user/index.ts','supabase/functions/ministry-admin-action/index.ts','supabase/functions/command-general-action/index.ts']){
            if(!fs.readFileSync(path,'utf8').includes('https://nnnsssxxxd-coder.github.io')) throw new Error(path+' is missing GitHub Pages CORS origin');
          }
          for(const token of ['profileError','membershipError','progressError','rankError','expireError','openError','recentError']){
            if(!quiz.includes(token)) throw new Error('quiz-engine missing checked database error: '+token);
          }
          const tables=['department_catalog','department_memberships','department_questions','department_quiz_attempts','department_commanders','department_exercises','department_exercise_questions','department_exercise_assignments','department_exercise_attempts','department_command_exam_attempts'];
          for(const table of tables){
            if(!branchMigration.includes("'"+table+"'")||!repairMigration.includes("'"+table+"'")) throw new Error('Missing branch migration for '+table);
          }
          for(const id of ['id="traffic"','id="trafficScene"','id="trafficStart"','id="musicYes"','id="musicNo"','id="musicPlayer"']){
            if(html.includes(id)) throw new Error('Removed UI control returned: '+id);
          }
          if(/const allowed=\[[^\]]*"traffic"/.test(html)) throw new Error('Removed traffic page still appears in navigation allow-list');
          const progressRepair=fs.readFileSync('supabase/migrations/20261119210000_harden_department_branch_columns.sql','utf8');
          for(const token of ['INSERT INTO public.progress','ON CONFLICT(user_id,service_branch) DO NOTHING','jsonb_set(','m.initial_rank']){
            if(!progressRepair.includes(token)) throw new Error('Missing progression repair safeguard: '+token);
          }
          console.log('PASS CORS, query error handling, department branch schema, progression repair and removed controls');
          NODE

      - name: Validate both Corps, quiz counts, brevetto cycles and Android icon
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const quiz=fs.readFileSync('supabase/functions/quiz-engine/index.ts','utf8');
          const brevetto=fs.readFileSync('supabase/functions/department-engine/index.ts','utf8');
          const traffic=fs.readFileSync('supabase/functions/traffic-control-engine/index.ts','utf8');
          const migration=fs.readFileSync('supabase/migrations/20261124190000_vehicle_brevetto_six_attempt_cycle.sql','utf8');
          const build=fs.readFileSync('.github/workflows/android-apk.yml','utf8');
          function ranks(name){
            const match=html.match(new RegExp('const '+name+'=\\[([^\\]]+)\\]'));
            if(!match)throw new Error('Missing '+name);
            return [...match[1].matchAll(/"([^"]+)"/g)].map(x=>x[1]);
          }
          for(const name of ['CARABINIERI_RANKS','FINANZA_RANKS']){
            const list=ranks(name);
            if(list.length!==24)throw new Error(name+' should contain 24 ordered official grades, found '+list.length);
            if(new Set(list).size!==list.length)throw new Error(name+' contains duplicate grades');
          }
          for(const token of ['#d4af37','#0d3b27','applyServiceBranding','FINANZA_RANKS','CARABINIERI_RANKS']){
            if(!html.includes(token))throw new Error('Missing branch identity: '+token);
          }
          if(!quiz.includes('shuffled.slice(0,5)')||!quiz.includes('answers.length!==5')||!html.includes('DOMANDA 1 / 5'))throw new Error('Rank exam must use five questions end-to-end');
          if(!brevetto.includes('start_vehicle_brevetto_attempt')||!brevetto.includes('answers.length!==8'))throw new Error('Eight-question brevetto flow is incomplete');
          for(const token of ['completed_attempts between 0 and 6',"interval '12 hours'","used_question_ids=array","jsonb_array_length(questions)=8","score <= 8"]){
            if(!migration.includes(token))throw new Error('Brevetto migration missing safeguard: '+token);
          }
          if(!build.includes('app-icon-foreground.svg')||!build.includes('mipmap-anydpi-v26/ic_launcher.xml')||!build.includes('application-icon-160:'))throw new Error('Android adaptive launcher icon is not verified');
          if(!traffic.includes('const finanzaScenarios')||!traffic.includes('scenarioPool=scenariosByBranch[branch as keyof typeof scenariosByBranch]'))throw new Error('The Guardia di Finanza needs its own economic-financial control scenarios');
          if(!html.includes('Controllo economico-finanziario')||!html.includes('Riferimento simulato: '))throw new Error('The Guardia di Finanza patrol UI must use its own terminology');

          console.log('PASS official rank lists, separate corps branding, five-question promotion exam, eight-question brevetto, six-attempt cooldown and adaptive APK icon');
          const dollarArgs=[...html.matchAll(/\\$\\(["']([^"']+)["']\\)/g)].map(x=>x[1]);
          if(dollarArgs.some(x=>x.startsWith('.')||x.startsWith('#')||x.startsWith('['))) throw new Error('The ID helper $() must not receive CSS selectors; use querySelector instead');
          if(!html.includes('rank>=9?"ISPETTORE":rank>=5?"SOVRINTENDENTE"')) throw new Error('Personnel role categories must distinguish inspectors and warrant officers');
          if(!html.includes('x.type==="vehicle_brevetto"?8')) throw new Error('Progress chart must use eight as the brevetto denominator');
          if(!html.includes('selectedBranch==="finanza"?"#d4af37":"#d71930"')) throw new Error('Rank graphic accents must follow the selected service branch');
          const command=fs.readFileSync('supabase/functions/command-general-action/index.ts','utf8');
          if(command.includes('rankFor(m)===24')||html.includes('branch==="finanza"?24:23')||html.includes('to==="finanza"?24:23')) throw new Error('Finanza rank ceiling must be index 23 (24 real grades)');
          console.log('PASS identical zero-based rank bounds across both Corps');

          console.log('PASS selector safety, real personnel-role grouping, mixed quiz score chart and branch-specific grade graphics');
          NODE
