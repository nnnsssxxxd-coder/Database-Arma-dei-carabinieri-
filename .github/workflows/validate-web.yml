name: Validate six-corps website
on:
  push:
    branches: [feat/expansione-sei-corpi]
    paths:
      - 'index.html'
      - 'corps-config.js'
      - 'service-worker.js'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - '.github/workflows/validate-web.yml'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check branch configuration
        run: |
          node --check corps-config.js
          node - <<'NODE'
          global.window = {};
          require('./corps-config.js');
          const config = window.CORPS_CONFIG;
          const expected = ['carabinieri','finanza','polizia','esercito','marina','aeronautica'];
          if (Object.keys(config).sort().join(',') !== expected.slice().sort().join(',')) throw new Error('Corpi mancanti o duplicati');
          for (const key of expected) {
            if (config[key].departments.length !== 11) throw new Error(key + ': il catalogo non contiene 11 voci');
            if (config[key].ranks.length < 24) throw new Error(key + ': catalogo gradi incompleto');
            if (!config[key].source || !/^https:\/\//.test(config[key].source)) throw new Error(key + ': fonte istituzionale assente');
          }
          console.log('Configurazione sei Corpi: OK');
          NODE
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: |
          deno check supabase/functions/username-login/index.ts
          deno check supabase/functions/admin-create-user/index.ts
          deno check supabase/functions/quiz-engine/index.ts
          deno check supabase/functions/department-engine/index.ts
          deno check supabase/functions/game-engine/index.ts
          deno check supabase/functions/command-general-login/index.ts
          deno check supabase/functions/command-general-action/index.ts
          deno check supabase/functions/ministry-admin-action/index.ts
          deno check supabase/functions/admin-user-action/index.ts
          deno check supabase/functions/audit-event/index.ts
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          html = open('index.html', encoding='utf-8').read()
          blocks = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, re.I)
          inline = [b for b in blocks if b.strip()]
          if not inline:
              raise SystemExit('Nessuno script inline trovato')
          for i, block in enumerate(inline):
              with open(f'/tmp/inline-{i}.js', 'w', encoding='utf-8') as out:
                  out.write(block)
          print(f'Controllo {len(inline)} blocchi inline')
          PY
          for file in /tmp/inline-*.js; do node --check "$file"; done
