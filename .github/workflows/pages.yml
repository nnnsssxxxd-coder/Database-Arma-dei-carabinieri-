name: Pubblica Simulatore Carabinieri

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
      - name: Verifica sintassi JavaScript incorporato
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(([, attrs, body]) => !/\bsrc\s*=/.test(attrs) && body.trim());
          if (!scripts.length) throw new Error('Nessuno script JavaScript incorporato trovato');
          scripts.forEach(([, , body], index) => new vm.Script(body, { filename: "index.html:inline-script-" + (index + 1) }));
          console.log("Sintassi valida: " + scripts.length + " script incorporati verificati.");
          NODE
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepara sito statico
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Pubblica sito
        id: deployment
        uses: actions/deploy-pages@v4
